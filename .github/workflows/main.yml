# example workflow for Coverity scans using the Black Duck Security Scan Action
# https://github.com/marketplace/actions/black-duck-security-scan
name: coverity-ss-action
on:
  push:
    branches: [ main, master, develop, stage, release ]
  pull_request:
    branches: [ main, master, develop, stage, release ]
  workflow_dispatch:
jobs:
  coverity:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Source
      uses: actions/checkout@v7
    - name: Coverity Scan
      uses: blackduck-inc/black-duck-security-scan@v2.11.0
      with:
        coverity_url: ${{ secrets.COVERITY_URL }}
        coverity_user: ${{ secrets.COV_USER }}
        coverity_password: ${{ secrets.COVERITY_PASSPHRASE }}
        # coverity_passphrase: ${{ secrets.COVERITY_PASSPHRASE }}
        coverity_policy_view: ${{ github.event_name != 'pull_request' && 'Outstanding Issues' || '' }}
        coverity_prComment_enabled: false 
        coverity_build_command: pip install -r requirements.txt
        coverity_clean_command: pip --version
        network_ssl_trustAll: true 
        coverity_local: true 
        github_token: ${{ secrets.GITHUB_TOKEN }}
        include_diagnostics: true 
